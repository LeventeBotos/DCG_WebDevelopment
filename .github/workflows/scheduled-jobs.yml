# Cloudflare Pages has no built-in cron, so GitHub Actions calls the protected endpoints on a schedule.
# Required repository secrets: SITE_URL (e.g. https://dataconsulting-group.com) and CRON_SECRET
# (must equal the CRON_SECRET environment variable set in Cloudflare Pages).
name: Scheduled jobs

on:
  schedule:
    - cron: "15 3 * * *" # daily maintenance, 03:15 UTC
    - cron: "0 7 * * 1" # weekly digest, Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [maintenance, digest]
        default: maintenance

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.job }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET secrets are not set"; exit 1; fi
          JOB="$MANUAL"
          if [ -z "$JOB" ]; then
            if [ "$SCHEDULE" = "0 7 * * 1" ]; then JOB=digest; else JOB=maintenance; fi
          fi
          echo "Running $JOB"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/$JOB"
